{% extends "base.html" %}

{% block content %}
<div class="login-center">
    <h2 class="login-title">Registro</h2>
    <form method="post" class="login-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="login-btn">Registrarse</button>
    </form>
    <a href="{% url 'login' %}">¿Ya tienes cuenta? Inicia sesión</a>
</div>
{% endblock %}

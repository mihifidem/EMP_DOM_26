

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sincronizador PRO</title>

<style>
body {
    font-family: system-ui, sans-serif;
    background: #0a1a3f;
    color: white;
    text-align: center;
    padding: 30px;
}

h1 { margin-bottom: 10px; }

.subtitle {
    font-size: 1.4rem;
    margin: 30px 0;
    min-height: 80px;
}

.controls button {
    margin: 5px;
    padding: 10px 16px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    background: gold;
    color: #1b2f7a;
}

.progress-container {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.2);
    margin-top: 20px;
    border-radius: 5px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: gold;
    border-radius: 5px;
}

.output {
    margin-top: 20px;
    font-size: 0.8rem;
    max-height: 150px;
    overflow-y: auto;
    text-align: left;
    background: rgba(0,0,0,0.3);
    padding: 10px;
    border-radius: 10px;
}
</style>
</head>
<body>

<h1>🎵 Sincronizador PRO</h1>
<p>Pulsa <strong>A</strong> para marcar tiempo</p>

<div class="subtitle" id="subtitle"></div>

<div class="controls">
    <button id="playBtn">▶️ Reproducir</button>
    <button id="backBtn">⬅ Retroceder</button>
    <button id="exportBtn">💾 Exportar JSON</button>
    <button id="clearBtn">🗑 Reiniciar</button>
</div>

<div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
</div>

<div class="output" id="output"></div>

<audio id="audio">
    <source src="DOM10_C01.mp3" type="audio/mpeg">
</audio>

<script>

// LETRA ORIGINAL
const lyrics = [

'En la orilla del agua clara',
'Donde el sol empieza a brillar',
'Unos hombres de manos rudas',
'Recogían redes del mar',
'Simón y su hermano Andrés',
'Miraban las olas pasar',
'Sin saber que aquella tarde',
'Su destino iba a cambiar',

'Se acercó un maestro bueno',
'Con ternura en el mirar',
'Les dijo dejad la barca',
'Otras redes hay que lanzar',
'Ya no busquen más pescaditos',
'Ni se queden junto al hogar',
'Ahora serán mis amigos',
'Y a los hombres cuidarán',

'Navega navega la barca',
'La barca de la amistad',
'Jesús va guiando el timón',
'Con amor y con bondad',
'Los doce amigos unidos',
'Formaron un gran jardín',
'Nació nuestra Iglesia santa',
'Que brilla de principio a fin',

'A veces el viento sopla',
'Y el cielo se quiere nublar',
'Pero Pedro no tiene miedo',
'Si Jesús lo sabe guiar',
'Unidos como familia',
'Queremos también ayudar',
'A que todos los niños del mundo',
'Tengan un lugar para jugar',

'Santiago y también Juan',
'Dejaron la playa atrás',
'Siguieron las huellas de Aquel',
'Que les daba paz',
'La barca siguió su camino',
'Cruzando la inmensidad',
'Llevando el mensaje del cielo',
'A toda la humanidad',

'Navega navega la barca',
'La barca de la amistad',
'Jesús va guiando el timón',
'Con amor y con bondad',
'Los doce amigos unidos',
'Formaron un gran jardín',
'Nació nuestra Iglesia santa',
'Que brilla de principio a fin',

'Navega navega la barca',
'La barca de la amistad',
'Si Jesús guía el camino',
'Nunca nos perderemos más'
];
const audio = document.getElementById("audio");
const subtitle = document.getElementById("subtitle");
const progressBar = document.getElementById("progressBar");
const output = document.getElementById("output");

const playBtn = document.getElementById("playBtn");
const backBtn = document.getElementById("backBtn");
const exportBtn = document.getElementById("exportBtn");
const clearBtn = document.getElementById("clearBtn");

const sourceEl = audio.querySelector("source");
const audioId = sourceEl ? sourceEl.getAttribute("src") : "default";
const storageKey = `syncedLyrics:${audioId}`;

let currentLine = 0;
let syncedLyrics = JSON.parse(localStorage.getItem(storageKey)) || [];

if (syncedLyrics.length > 0) {
    currentLine = syncedLyrics.length;
}

if (currentLine >= lyrics.length) {
    currentLine = 0;
    syncedLyrics = [];
}

updateSubtitle();
renderOutput();

playBtn.addEventListener("click", () => {
    audio.play();
});

backBtn.addEventListener("click", () => {
    if (currentLine > 0) {
        currentLine--;
        syncedLyrics.pop();
        saveProgress();
        updateSubtitle();
        renderOutput();
    }
});

clearBtn.addEventListener("click", () => {
    syncedLyrics = [];
    currentLine = 0;
    saveProgress();
    updateSubtitle();
    renderOutput();
});

exportBtn.addEventListener("click", () => {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(syncedLyrics, null, 2));
    const downloadAnchorNode = document.createElement('a');
    downloadAnchorNode.setAttribute("href", dataStr);
    downloadAnchorNode.setAttribute("download", "lyrics_sync.json");
    document.body.appendChild(downloadAnchorNode);
    downloadAnchorNode.click();
    downloadAnchorNode.remove();
});

document.addEventListener("keydown", (e) => {

    if (e.key.toLowerCase() === "a") {

        if (currentLine < lyrics.length) {

            syncedLyrics.push({
                time: parseFloat(audio.currentTime.toFixed(2)),
                text: lyrics[currentLine]
            });

            currentLine++;
            saveProgress();
            updateSubtitle();
            renderOutput();
        }
    }
});

audio.addEventListener("timeupdate", () => {
    const progress = (audio.currentTime / audio.duration) * 100;
    progressBar.style.width = progress + "%";
});

function updateSubtitle() {
    subtitle.innerText = lyrics[currentLine] || "✔ Sincronización completa";
}

function renderOutput() {
    output.innerText = JSON.stringify(syncedLyrics, null, 2);
}

function saveProgress() {
    localStorage.setItem(storageKey, JSON.stringify(syncedLyrics));
}

</script>

</body>
</html>

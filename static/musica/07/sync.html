

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sincronizador PRO</title>

<style>
body {
    font-family: system-ui, sans-serif;
    background: #0a1a3f;
    color: white;
    text-align: center;
    padding: 30px;
}

h1 { margin-bottom: 10px; }

.subtitle {
    font-size: 1.4rem;
    margin: 30px 0;
    min-height: 80px;
}

.controls button {
    margin: 5px;
    padding: 10px 16px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    background: gold;
    color: #1b2f7a;
}

.progress-container {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.2);
    margin-top: 20px;
    border-radius: 5px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: gold;
    border-radius: 5px;
}

.output {
    margin-top: 20px;
    font-size: 0.8rem;
    max-height: 150px;
    overflow-y: auto;
    text-align: left;
    background: rgba(0,0,0,0.3);
    padding: 10px;
    border-radius: 10px;
}
</style>
</head>
<body>

<h1>🎵 Sincronizador PRO</h1>
<p>Pulsa <strong>A</strong> para marcar tiempo</p>

<div class="subtitle" id="subtitle"></div>

<div class="controls">
    <button id="playBtn">▶️ Reproducir</button>
    <button id="backBtn">⬅ Retroceder</button>
    <button id="exportBtn">💾 Exportar JSON</button>
    <button id="clearBtn">🗑 Reiniciar</button>
</div>

<div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
</div>

<div class="output" id="output"></div>

<audio id="audio">
    <source src="DOM07_C01.mp3" type="audio/mpeg">
</audio>

<script>

// LETRA ORIGINAL
const lyrics = [
'Sigue la Estrella',
'Una estrella en el cielo brilló',
'No se guarda su luz, se mostró',
'Marca un camino nuevo al andar',
'Invita a salir y buscar',
'Tres viajeros se ponen en pie',
'No lo saben todo, pero creen',
'Cuando sigues la luz con verdad',
'El corazón aprende a mirar',

'Sigue la estrella, déjate guiar',
'La luz de Dios no es solo para unos más',
'Sigue la estrella, no mires atrás',
'Jesús es regalo para la humanidad',

'No llegaron con prisas ni poder',
'Ttrajeron lo mejor de su ser',
'Oro, incienso y mirra al llegar',
'Pero el mayor regalo es amar',
'Cuando compartes lo que hay en ti',
'La luz se hace grande al salir',
'Dios se revela al mundo entero',
'En un niño pequeño y sincero',

'Sigue la estrella, déjate guiar',
'La luz de Dios no es solo para unos más',
'Sigue la estrella, no mires atrás',
'Jesús es regalo para la humanidad',

'La luz no se esconde',
'La luz se da',
'Cuando la compartes',
'Crece mucho más',

'Sigue la estrella, sal a buscar',
'Que Dios se muestra donde hay verdad',
'Sigue la estrella, aprende a dar',
'Jesús es la luz',
'Para todos igual'
];
const audio = document.getElementById("audio");
const subtitle = document.getElementById("subtitle");
const progressBar = document.getElementById("progressBar");
const output = document.getElementById("output");

const playBtn = document.getElementById("playBtn");
const backBtn = document.getElementById("backBtn");
const exportBtn = document.getElementById("exportBtn");
const clearBtn = document.getElementById("clearBtn");

const sourceEl = audio.querySelector("source");
const audioId = sourceEl ? sourceEl.getAttribute("src") : "default";
const storageKey = `syncedLyrics:${audioId}`;

let currentLine = 0;
let syncedLyrics = JSON.parse(localStorage.getItem(storageKey)) || [];

if (syncedLyrics.length > 0) {
    currentLine = syncedLyrics.length;
}

if (currentLine >= lyrics.length) {
    currentLine = 0;
    syncedLyrics = [];
}

updateSubtitle();
renderOutput();

playBtn.addEventListener("click", () => {
    audio.play();
});

backBtn.addEventListener("click", () => {
    if (currentLine > 0) {
        currentLine--;
        syncedLyrics.pop();
        saveProgress();
        updateSubtitle();
        renderOutput();
    }
});

clearBtn.addEventListener("click", () => {
    syncedLyrics = [];
    currentLine = 0;
    saveProgress();
    updateSubtitle();
    renderOutput();
});

exportBtn.addEventListener("click", () => {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(syncedLyrics, null, 2));
    const downloadAnchorNode = document.createElement('a');
    downloadAnchorNode.setAttribute("href", dataStr);
    downloadAnchorNode.setAttribute("download", "lyrics_sync.json");
    document.body.appendChild(downloadAnchorNode);
    downloadAnchorNode.click();
    downloadAnchorNode.remove();
});

document.addEventListener("keydown", (e) => {

    if (e.key.toLowerCase() === "a") {

        if (currentLine < lyrics.length) {

            syncedLyrics.push({
                time: parseFloat(audio.currentTime.toFixed(2)),
                text: lyrics[currentLine]
            });

            currentLine++;
            saveProgress();
            updateSubtitle();
            renderOutput();
        }
    }
});

audio.addEventListener("timeupdate", () => {
    const progress = (audio.currentTime / audio.duration) * 100;
    progressBar.style.width = progress + "%";
});

function updateSubtitle() {
    subtitle.innerText = lyrics[currentLine] || "✔ Sincronización completa";
}

function renderOutput() {
    output.innerText = JSON.stringify(syncedLyrics, null, 2);
}

function saveProgress() {
    localStorage.setItem(storageKey, JSON.stringify(syncedLyrics));
}

</script>

</body>
</html>
